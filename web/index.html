<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面绒毯</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="cloth"></canvas><div id="flights"></div><div id="broom" aria-hidden="true">🧹</div>
